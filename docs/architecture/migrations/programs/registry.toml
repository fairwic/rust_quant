[[program]]
program_id = "MP-vegas-research-parity-v1"
title = "Vegas Research 分层 parity 与 quant-lab 迁移"
kind = "multi_owner_internal_migration"
state = "planned"
evidence_scope = "current_migration"
parent_plan = "docs/architecture/vegas-backtest-migration.md"
repositories = ["rust_quant", "rust_quant_alpha"]
historical_dependency_eligible = false

[[program.contracts]]
contract_id = "ResearchDecisionContextSnapshotV1"
version = "v1"
compatibility_window = "initial v1; ResearchRunSpec and all owner API consumers pin the same canonical hash"
kind = "owner_value"
direction = "rust_quant_alpha::Research -> rust_quant_alpha::Strategy/Portfolio/Risk/Execution"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["research_scenario_ref", "strategy_runtime_snapshot_ref", "portfolio_policy_snapshot_ref", "risk_policy_snapshot_ref", "execution_planning_policy_snapshot_ref", "subject_binding_hash", "context_hash"]
forbidden_fields = ["execution_request_id", "claim_id", "claim_fence", "credential_reference", "gateway_capability"]

[[program.contracts]]
contract_id = "ExecutionPlanningValueV1"
version = "v1"
compatibility_window = "initial v1; Dry-run/Research/Paper compare canonical v1; live initialization accepts v1 during migration"
kind = "owner_value"
direction = "rust_quant_alpha::Execution -> rust_quant_alpha::DryRun/Research/Paper"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["planning_policy_snapshot_ref", "ordered_child_order_plans", "protection_planning_value", "planning_hash"]
forbidden_fields = ["execution_request_id", "claim_id", "order_intent_id", "execution_plan_id", "submit_pending", "outbox_id", "mutation_permit"]

[[program.contracts]]
contract_id = "ResearchExecutionArtifactRefV1"
version = "v1"
compatibility_window = "initial v1; RunSpec pins one exact artifact; replacement creates a new ref"
kind = "owner_value"
direction = "rust_quant_alpha::Build -> rust_quant_alpha::Research"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["git_revision", "patch_sha256", "cargo_lock_sha256", "toolchain", "target", "profile", "features", "package", "entry_checksum", "dependency_graph_sha256", "prng_version", "scheduler_version"]

# 该早期 Contract 把 Research-owned selection_algorithm_hash 错放进 Market 输出，
# 且已经随 Registry revision 冻结；不得原地改写或实施。未来使用分离 Market facts
# 与 Research DatasetManifest 的新版本 Contract。
[[program.contracts]]
contract_id = "PointInTimeDatasetManifestV1"
version = "v1"
compatibility_window = "initial v1; Research pins immutable Market artifact hashes; a data revision creates a new manifest"
kind = "owner_value"
direction = "rust_quant_alpha::Market -> rust_quant_alpha::Research"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["dataset_id", "as_of", "available_at_policy", "universe_membership_intervals", "listing_delisting_events", "selection_algorithm_hash", "source_revisions", "gap_revision_policy", "instrument_rules_history", "funding_index_mark_refs", "content_hash"]

[[program.contracts]]
contract_id = "EvaluationManifestV1"
version = "v1"
compatibility_window = "initial v1; each hypothesis pins one immutable manifest before target OOS is read"
kind = "owner_value"
direction = "rust_quant_alpha::Research -> rust_quant_alpha::Research"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["hypothesis_id", "train_validation_oos_windows", "walk_forward_folds", "purge_embargo", "parameter_space", "optimizer_version", "seed", "trial_budget", "selection_rule", "cost_stress", "coverage_gates", "concentration_gates", "holdout_reuse_count", "manifest_hash"]

[[program.contracts]]
contract_id = "PromotionReceiptV1"
version = "v1"
compatibility_window = "initial v1; Strategy writes immutable receipts; Control accepts the pinned version for ActivationEligibility"
kind = "owner_value"
direction = "rust_quant_alpha::Strategy -> rust_quant_alpha::Control"
snapshot = { status = "not_created", ref = "", sha256 = "" }
required_fields = ["candidate_definition_artifact_ref", "research_execution_artifact_ref", "completed_evidence_ref", "evaluation_gate_result_ref", "released_definition_artifact_ref", "released_build_digest", "cross_build_parity_ref", "approved_by", "approved_at", "allowed_deployment_channels", "receipt_hash"]

# 该早期 child 的空依赖和混合范围已经冻结，不能绕过 Market foundation 或继续实施。
# 后续必须新登记 Market facts successor；Research-owned universe/DatasetManifest 另建 child。
